[package]
name = "chunk-pregen"
version = "1.0.0"
edition = "2024"
description = "Chunk pre-generation for Pumpkin (like Chunky): shapes, progress, ETA, pause/resume"

[lib]
# cdylib = the .wasm plugin, rlib = lets `cargo test` run the unit tests
crate-type = ["cdylib", "rlib"]

[dependencies]
pumpkin-plugin-api = "0.2.1+26.3-26.51"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
